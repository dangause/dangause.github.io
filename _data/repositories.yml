github_users:
  - dangause

repo_description_lines_max: 2

github_repos:
  - name: NSF-Simons-CosmicAI-Institute/manna
    language: Python
    description: An MCP server that gives AI agents structured access to astronomical archives through IVOA standards, with curated notes for the Astro Data Lab, ALMA, ESO, CADC, and Gaia.
  - name: dangause/stips
    language: Python
    description: The Small Telescope Image Processing Suite, which brings the LSST Science Pipelines to 1-meter-class telescopes.
  - name: dangause/hrs-botany
    language: Jupyter Notebook
    description: Predicting where tree species are absent using hyperspectral satellite imagery, for a California Academy of Sciences research project.
  - name: dangause/astro-buddy
    language: Python
    description: A question-answering web app for quasar research, built on recent arXiv papers.
  - name: dangause/qso-cv
    language: Jupyter Notebook
    description: Data preparation and baseline models for classifying broad absorption line quasars in SDSS spectra.
  - name: dangause/expedition-clustering
    language: Jupyter Notebook
    description: Grouping museum botanical specimens back into the collecting expeditions they came from.
